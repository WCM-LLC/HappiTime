name: Digest check

# The venue digest runs at 11:00 UTC (6am America/Chicago). This runs after it
# and fails the workflow when the digest did not deliver, so GitHub notifies —
# a channel that does not depend on the email system being checked.
#
# Scheduled an hour later rather than immediately after, because GitHub delays
# scheduled runs under load (observed gaps of ~50 minutes on the uptime check).
# A daily check has room for that; it only needs to land within the window.
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

concurrency:
  group: digest-check
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      # via env, never interpolated into run:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set as repository secrets."
            exit 1
          fi
      - name: Check venue digest delivery
        run: node scripts/check-digest.mjs
