name: Auth config check

# On demand only. GoTrue's redirect allow-list changes when a domain is added
# or a console URL moves — both rare and both deliberate — so a schedule would
# only produce noise. Run this after attaching a domain, changing
# NEXT_PUBLIC_CONSOLE_URL, or whenever "can people log in there?" is the
# question.
#
# It cannot be answered from outside the project: GoTrue does not validate
# `redirect_to` at /authorize, so a bogus domain and a legitimate one are
# indistinguishable from the public API.
on:
  workflow_dispatch:

jobs:
  auth-config:
    runs-on: ubuntu-latest
    env:
      # via env, never interpolated into run:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set as repository secrets."
            exit 1
          fi
      - name: Check GoTrue redirect allow-list
        run: node scripts/check-auth-redirects.mjs
